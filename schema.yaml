  /api/dashboard/overview/:
    get:
      operationId: dashboard_overview_retrieve
      summary: Overview statistics (real, DB-computed)
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD (with to) — custom window
      - in: query
        name: range
        schema:
          type: string
        description: 7d | 14d | 30d | 90d | all (default 30d)
      - in: query
        name: to
        schema:
          type: string
        description: YYYY-MM-DD (with from) — custom window
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
