components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        is_active:
          type: boolean
      required:
      - name
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    Design:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 160
        category:
          type: string
          readOnly: true
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        min_stock:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        avg_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
        stock_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        damaged_quantity:
          type: integer
          readOnly: true
        notes:
          type: string
          maxLength: 255
        rights:
          type: string
          maxLength: 160
        archived:
          type: boolean
        batches:
          type: array
          items:
            $ref: '#/components/schemas/PrintBatch'
          readOnly: true
        image_url:
          type: string
          readOnly: true
        is_low_stock:
          type: boolean
          readOnly: true
        is_out_of_stock:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avg_cost
      - batches
      - category
      - code
      - created_at
      - damaged_quantity
      - id
      - image_url
      - is_low_stock
      - is_out_of_stock
      - name
      - price
      - stock_value
      - unit_cost
      - updated_at
    DesignRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        min_stock:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        notes:
          type: string
          maxLength: 255
        rights:
          type: string
          maxLength: 160
        archived:
          type: boolean
      required:
      - name
      - price
    DesignWrite:
      type: object
      description: Create/update a design. Accepts category name; price/qty validated.
      properties:
        name:
          type: string
          maxLength: 160
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_stock:
