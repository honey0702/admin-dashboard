      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          writeOnly: true
          minLength: 1
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_stock:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        notes:
          type: string
          maxLength: 255
